<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>AI RoleX · 题在桌上，麦在我这儿</title>
<style>
:root{--ink:#f3f2ef;--muted:#b0b0aa;--dim:#7d7f78;--rule:#34352f;--red:#ff594b;--mint:#a8ddc6;--bg:#121310;--card:#1b1c19}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 18px/1.7 "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
main{width:min(880px,100% - 40px);margin:0 auto;padding:64px 0 48px}
.brand{display:flex;align-items:center;gap:12px;font:700 15px/1 Bahnschrift,"Segoe UI",sans-serif;letter-spacing:.08em;color:var(--muted)}
.brand i{width:10px;height:22px;background:var(--red);transform:skewX(-14deg)}
.kicker{font:700 15px/1 Bahnschrift,"Segoe UI",sans-serif;letter-spacing:.08em;color:var(--red);margin:34px 0 0}
h1{font-size:clamp(38px,7vw,64px);line-height:1.15;margin:14px 0 12px}
h1 span{color:var(--red)}
.sub{color:var(--muted);margin:0 0 36px}
.go{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.go a{display:block;background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:24px 26px;color:inherit;text-decoration:none}
.go a:hover{border-color:var(--ink)}
.go b{display:block;font-size:28px;margin-bottom:6px}
.go a.main b{color:var(--red)}
.go span{color:var(--muted);font-size:16px}
kbd{font:700 13px/1 Consolas,"Microsoft YaHei",monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:2px 6px;color:var(--ink)}
.note{color:var(--dim);font-size:15px;margin-top:30px}
</style>
</head>
<body>
<main>
  <div class="brand"><i></i>AI ROLEX</div>
  <p class="kicker">2 小时 · 27 页</p>
  <h1>题在桌上，<br><span>麦在我这儿。</span></h1>
  <p class="sub">AI 浪潮躲不开：先接上工具，再动起来；换个角色，也换个角度。</p>
  <div class="go">
    <a class="main" href="AI_RoleX.html"><b>▶ 幻灯片</b><span>放映用。<kbd>←</kbd> <kbd>→</kbd> 翻页，<kbd>F</kbd> 全屏，<kbd>D</kbd> 目录，<kbd>M</kbd> 关动效。</span></a>
    <a href="script.html"><b>彩色逐字稿</b><span>练习用，手机也能看。黑字照着念，蓝字是动作、不念。</span></a>
  </div>
  <p class="note">🔒 幻灯片和逐字稿都要先输密码；在一台设备上输过一次就会记住。</p>
</main>
</body>
</html>
