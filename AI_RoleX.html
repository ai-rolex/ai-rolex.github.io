<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>AI RoleX · 幻灯片</title>
<style>
:root{--ink:#f3f2ef;--muted:#b0b0aa;--dim:#7d7f78;--rule:#34352f;--red:#ff594b;--bg:#121310;--card:#1b1c19}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:400 18px/1.6 "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif}
form{width:min(420px,100% - 40px);display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:12px;font:700 15px/1 Bahnschrift,"Segoe UI",sans-serif;letter-spacing:.08em;color:var(--muted)}
.brand i{width:10px;height:22px;background:var(--red);transform:skewX(-14deg)}
h1{font-size:32px;line-height:1.3;margin:6px 0 4px}
input[type=password]{font:inherit;font-size:20px;color:var(--ink);background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:12px 14px;outline:none;width:100%}
input[type=password]:focus{border-color:var(--ink)}
label{color:var(--muted);font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer}
label input{width:18px;height:18px;margin:0;accent-color:var(--red)}
button{font:inherit;font-weight:700;color:#121310;background:var(--red);border:0;border-radius:999px;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.6em;margin:0;color:var(--red);font-size:15px}
.back{color:var(--dim);font-size:14px;text-decoration:none}
.back:hover{color:var(--ink)}
</style>
</head>
<body>
<form id="gate">
  <div class="brand"><i></i>AI ROLEX</div>
  <h1>这一页需要密码</h1>
  <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="输入密码" required autofocus>
  <label><input id="keep" type="checkbox" checked>记住这台设备</label>
  <button id="go" type="submit">打开</button>
  <p id="msg" role="status" aria-live="polite"></p>
  <a class="back" href="./">← 返回首页</a>
</form>

  const KEY = 'rolex-gate';
  const $ = id => document.getElementById(id);
  const say = t => { $('msg').textContent = t; };
  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  if (!window.crypto || !crypto.subtle) {
    say('这个浏览器打不开加密页面，请用 Chrome、Edge 或 Safari 打开 https 地址。');
    $('go').disabled = true;
    return;
  }
  if (/(^|[?&])lock([=&]|$)/.test(location.search)) { try { localStorage.removeItem(KEY); } catch (e) {} }

  // document.open() only replaces the page once loading has finished
  const loaded = new Promise(r => {
    if (document.readyState === 'complete') setTimeout(r, 0);
    else addEventListener('load', () => setTimeout(r, 0), { once: true });
  });

  async function show(key) {
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.i) }, key, bytes(P.c));
    const html = new TextDecoder().decode(buf);
    await loaded;
    document.open();
    document.write(html);
    document.close();
  }

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.s), iterations: P.n, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }

  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (saved && saved.s === P.s) {
    $('gate').style.visibility = 'hidden';
    (async () => {
      try {
        await show(await crypto.subtle.importKey('raw', bytes(saved.k), 'AES-GCM', true, ['decrypt']));
      } catch (e) {
        try { localStorage.removeItem(KEY); } catch (e2) {}
        $('gate').style.visibility = '';
      }
    })();
  }

  $('gate').addEventListener('submit', async e => {
    e.preventDefault();
    $('go').disabled = true;
    say('正在解锁……');
    let key;
    try {
      key = await derive($('pw').value);
      await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.i) }, key, bytes(P.c));

      $('pw').select();

      try { localStorage.setItem(KEY, JSON.stringify({ s: P.s, k: b64(await crypto.subtle.exportKey('raw', key)) })); } catch (e2) {}

    await show(key);
  });
